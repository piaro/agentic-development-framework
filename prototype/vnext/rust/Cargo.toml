[package]
name = "agentic-vnext-rust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ed25519-dalek = "2.2"
http = "1"
regex = "1"
rmcp = { version = "3.0.1", features = ["transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1.50", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
ureq = { version = "3", default-features = false, features = ["rustls"] }
