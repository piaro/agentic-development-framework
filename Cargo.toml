[package]
name = "agentic-development-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Control plane that connects specifications, decisions, implementation, and evidence in a repository worked on by AI agents"
repository = "https://github.com/piaro/agentic-development-kit"
readme = "README.md"
# Distribution happens through signed native binaries, not crates.io.
publish = false

[lib]
name = "agentic"
path = "src/lib.rs"

[[bin]]
name = "agentic"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2.2"
http = "1"
regex = "1"
rmcp = { version = "3.0.1", features = ["transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1.50", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-gdscript = "6.1"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23"
ureq = { version = "3", default-features = false, features = ["rustls"] }
